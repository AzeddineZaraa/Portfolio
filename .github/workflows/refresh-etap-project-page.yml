name: Refresh ETAP project page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-etap-project-page.yml'
      - 'etap-industrial-network.html'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Redesign ETAP project page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('etap-industrial-network.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          /* --- ETAP project cover redesign --- */
          .hero{min-height:auto;background:var(--paper);color:var(--ink);padding:0;border-bottom:1px solid var(--line)}
          .hero:after{display:none}
          .hero-inner{min-height:auto;display:block}
          .hero-cover{position:relative;width:100%;padding:28px 0 0}
          .hero-image{width:100%;display:block;border-radius:16px;box-shadow:0 20px 55px rgba(6,26,51,.16);border:1px solid var(--line);background:#fff}
          .hero-toolbar{position:absolute;left:24px;right:24px;top:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
          .hero-toolbar .back{margin:0;padding:10px 14px;border-radius:8px;background:rgba(9,39,23,.82);border:1px solid rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(8px)}
          .hero-toolbar .back:hover{color:var(--lime);border-color:var(--lime)}
          .hero-badge{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:8px;background:rgba(9,39,23,.82);border:1px solid rgba(121,201,67,.5);color:#dff4e4;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px)}
          .project-head{padding:38px 0 48px}
          .project-head-grid{display:grid;grid-template-columns:1.5fr .7fr;gap:34px;align-items:end}
          .project-head h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:-.03em}
          .project-head h1 span{color:var(--lime2)}
          .project-lead{max-width:780px;color:var(--muted);font-size:14px;line-height:1.8;margin:15px 0 0}
          .head-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .meta-box{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px}
          .meta-box strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--lime2);margin-bottom:5px}
          .meta-box span{font-size:11px;color:var(--muted);line-height:1.45}
          .project-head .tags{margin-top:20px}
          @media(max-width:800px){.hero-cover{padding-top:15px}.hero-toolbar{left:12px;right:12px;top:28px}.hero-toolbar .back{font-size:11px;padding:8px 10px}.hero-badge{font-size:9px;padding:8px 9px}.project-head{padding:30px 0 38px}.project-head-grid{grid-template-columns:1fr;gap:22px}.hero-image{border-radius:11px}}
          @media(max-width:560px){.hero-toolbar{top:23px}.hero-toolbar .back span{display:none}.hero-badge{font-size:8px}.project-head h1{font-size:31px}.project-lead{font-size:13px}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          new_header = r'''<header class="hero">
          <div class="container hero-inner">
            <div class="hero-cover">
              <img class="hero-image" src="assets/page.png" alt="Industrial Electrical Network — ETAP Load Flow Study">
              <div class="hero-toolbar">
                <a class="back" href="index.html#projects"><i class="fa-solid fa-arrow-left"></i><span data-fr>Retour aux projets</span><span data-en>Back to projects</span></a>
                <div class="hero-badge"><i class="fa-solid fa-bolt"></i> ETAP PROJECT</div>
              </div>
            </div>
          </div>
          </header>
          <section class="project-head">
            <div class="container">
              <div class="project-head-grid">
                <div>
                  <div class="eyebrow"><i class="fa-solid fa-industry"></i> POWER SYSTEMS • ETAP</div>
                  <h1>Industrial Electrical <span>Network</span><br>Load Flow Study</h1>
                  <p class="project-lead" data-fr>Modélisation et analyse d'un réseau électrique industriel sous ETAP : architecture du réseau, écoulement de puissance, niveaux de tension, courants et facteurs de puissance.</p>
                  <p class="project-lead" data-en>Modelling and analysis of an industrial electrical network in ETAP, covering network architecture, load flow, voltage levels, currents and power factors.</p>
                  <div class="tags"><span class="tag" style="background:var(--navy);border-color:var(--lime)">ETAP</span><span class="tag" style="background:var(--navy);border-color:var(--lime)">Load Flow</span><span class="tag" style="background:var(--navy);border-color:var(--lime)">Industrial Network</span><span class="tag" style="background:var(--navy);border-color:var(--lime)">MV / LV</span><span class="tag" style="background:var(--navy);border-color:var(--lime)">Power Factor</span></div>
                </div>
                <div class="head-meta">
                  <div class="meta-box"><strong data-fr>Logiciel</strong><strong data-en>Software</strong><span>ETAP</span></div>
                  <div class="meta-box"><strong data-fr>Étude</strong><strong data-en>Study</strong><span>Load Flow</span></div>
                  <div class="meta-box"><strong data-fr>Réseau</strong><strong data-en>Network</strong><span>Industrial MV / LV</span></div>
                  <div class="meta-box"><strong data-fr>Analyse</strong><strong data-en>Analysis</strong><span>V, I, PF &amp; loading</span></div>
                </div>
              </div>
            </div>
          </section>'''
          s, n = re.subn(r'<header class="hero">.*?</header>', new_header, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Hero header not found')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etap-industrial-network.html
          git diff --cached --quiet || git commit -m 'Redesign ETAP project page with cover image'
          git push origin HEAD:main
