name: Update industrial project card
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-industrial-card.yml'
jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update industrial project cover
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<article class="project" id="industrial-network-project"><div class="cover"><img src="assets/img1.png" alt="Industrial Electrical Network ETAP">'
          new = '<article class="project" id="industrial-network-project"><div class="cover"><img src="assets/page.png" alt="Industrial Electrical Network — ETAP Load Flow Study">'
          if old not in s:
              raise SystemExit('Industrial project card pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update industrial project card cover'
          git push origin HEAD:main
