name: Restructure ETAP project
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-etap.yml'
jobs:
  restructure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restructure project page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('etap-industrial-network.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* --- Study navigation and sections --- */
          .study-nav{position:sticky;top:78px;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(6,26,51,.05)}
          .study-nav-inner{display:flex;gap:8px;overflow:auto;padding:10px 0}
          .study-nav a{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:800;color:var(--muted);background:var(--paper2)}
          .study-nav a:hover{border-color:var(--lime);color:var(--lime2)}
          .study-section{scroll-margin-top:135px}
          .study-section .section-kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;background:rgba(121,201,67,.12);color:var(--lime2);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
          .study-section h2{font-size:28px;margin:0 0 10px}
          .study-intro{max-width:820px;color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 26px}
          .study-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:start}
          .study-points{display:grid;gap:10px;margin-top:15px}
          .study-point{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--paper2)}
          .study-point i{color:var(--lime);margin-top:2px}
          .study-point strong{display:block;font-size:11px;margin-bottom:3px}.study-point span{font-size:11px;line-height:1.55;color:var(--muted)}
          .study-gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px}
          .study-gallery figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px;box-shadow:var(--shadow)}
          .study-gallery img{width:100%;display:block;border-radius:8px;cursor:zoom-in;background:#fff}.study-gallery figcaption{font-size:10.5px;color:var(--muted);text-align:center;padding:8px 3px 2px}
          .study-banner{margin-top:24px;padding:18px 20px;border-left:3px solid var(--lime);background:rgba(121,201,67,.08);border-radius:0 10px 10px 0}.study-banner strong{display:block;font-size:12px;margin-bottom:5px}.study-banner p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
          @media(max-width:800px){.study-nav{top:68px}.study-grid{grid-template-columns:1fr}.study-gallery{grid-template-columns:1fr}.study-section h2{font-size:24px}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          body=r'''
          <nav class="study-nav"><div class="container study-nav-inner">
            <a href="#power-flow"><i class="fa-solid fa-wave-square"></i><span data-fr>Power Flow Study</span><span data-en>Power Flow Study</span></a>
            <a href="#protection"><i class="fa-solid fa-shield-halved"></i><span data-fr>Protection Coordination</span><span data-en>Protection Coordination</span></a>
          </div></nav>
          <section class="section study-section" id="power-flow">
            <div class="container">
              <div class="section-kicker"><i class="fa-solid fa-wave-square"></i> POWER SYSTEM ANALYSIS</div>
              <h2><span data-fr>01 — Étude Power Flow</span><span data-en>01 — Power Flow Study</span></h2>
              <p class="study-intro" data-fr>Analyse de l'écoulement de puissance du réseau industriel sous ETAP afin d'évaluer les niveaux de tension, les courants, les flux de puissance, le chargement des équipements et les facteurs de puissance.</p>
              <p class="study-intro" data-en>Load-flow analysis of the industrial network in ETAP to evaluate voltage levels, currents, power flows, equipment loading and power factors.</p>
              <div class="study-grid">
                <div class="card">
                  <div class="label" data-fr>Objectifs de l'étude</div><div class="label" data-en>Study objectives</div>
                  <div class="study-points">
                    <div class="study-point"><i class="fa-solid fa-check"></i><div><strong data-fr>Validation du réseau</strong><strong data-en>Network validation</strong><span data-fr>Vérifier le comportement électrique du réseau en régime permanent.</span><span data-en>Verify the electrical behaviour of the network in steady state.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-check"></i><div><strong data-fr>Niveaux de tension</strong><strong data-en>Voltage levels</strong><span data-fr>Identifier les bus présentant des écarts de tension et analyser leur origine.</span><span data-en>Identify buses with voltage deviations and analyse their causes.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-check"></i><div><strong data-fr>Chargement</strong><strong data-en>Equipment loading</strong><span data-fr>Évaluer les courants et le chargement des transformateurs et départs.</span><span data-en>Evaluate currents and loading of transformers and feeders.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-check"></i><div><strong data-fr>Facteur de puissance</strong><strong data-en>Power factor</strong><span data-fr>Observer les facteurs de puissance et l'impact de la compensation réactive.</span><span data-en>Assess power factors and the effect of reactive power compensation.</span></div></div>
                  </div>
                </div>
                <div class="study-gallery">
                  <figure><img src="assets/img1.png" alt="ETAP industrial network power flow model"><figcaption data-fr>Modèle du réseau industriel sous ETAP</figcaption><figcaption data-en>Industrial network model in ETAP</figcaption></figure>
                  <figure><img src="assets/img2.png" alt="ETAP load flow results"><figcaption data-fr>Résultats de l'étude Power Flow</figcaption><figcaption data-en>Power Flow study results</figcaption></figure>
                </div>
              </div>
              <div class="study-banner"><strong data-fr>Résultat recherché</strong><strong data-en>Expected outcome</strong><p data-fr>Obtenir une vision claire de la répartition des puissances et de l'état électrique du réseau avant de passer à l'étude de protection.</p><p data-en>Obtain a clear view of power distribution and network electrical conditions before moving to protection analysis.</p></div>
            </div>
          </section>
          <section class="section alt study-section" id="protection">
            <div class="container">
              <div class="section-kicker"><i class="fa-solid fa-shield-halved"></i> PROTECTION &amp; SELECTIVITY</div>
              <h2><span data-fr>02 — Coordination des protections</span><span data-en>02 — Protection Coordination</span></h2>
              <p class="study-intro" data-fr>Étude de la coordination des dispositifs de protection afin d'assurer la sélectivité du réseau, de limiter les déclenchements intempestifs et de protéger les équipements contre les défauts et surintensités.</p>
              <p class="study-intro" data-en>Protection coordination study aimed at achieving network selectivity, reducing nuisance tripping and protecting equipment against faults and overcurrents.</p>
              <div class="study-grid">
                <div class="card">
                  <div class="label" data-fr>Approche</div><div class="label" data-en>Approach</div>
                  <div class="study-points">
                    <div class="study-point"><i class="fa-solid fa-shield-halved"></i><div><strong data-fr>Dispositifs de protection</strong><strong data-en>Protection devices</strong><span data-fr>Prise en compte des protections associées aux départs, transformateurs et charges.</span><span data-en>Consider protection devices associated with feeders, transformers and loads.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-chart-line"></i><div><strong data-fr>Sélectivité</strong><strong data-en>Selectivity</strong><span data-fr>Vérifier que le dispositif le plus proche du défaut intervient en priorité.</span><span data-en>Verify that the protection closest to the fault operates first.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-bolt"></i><div><strong data-fr>Courants de défaut</strong><strong data-en>Fault currents</strong><span data-fr>Utiliser les niveaux de court-circuit comme base pour le réglage des protections.</span><span data-en>Use short-circuit levels as a basis for protection settings.</span></div></div>
                    <div class="study-point"><i class="fa-solid fa-sliders"></i><div><strong data-fr>Réglages</strong><strong data-en>Settings</strong><span data-fr>Comparer les seuils et temporisations pour obtenir une coordination cohérente.</span><span data-en>Compare pickup thresholds and time delays for consistent coordination.</span></div></div>
                  </div>
                </div>
                <div class="study-gallery">
                  <figure><img src="assets/img3.png" alt="ETAP protection coordination study"><figcaption data-fr>Configuration des protections sous ETAP</figcaption><figcaption data-en>Protection configuration in ETAP</figcaption></figure>
                  <figure><img src="assets/img4.png" alt="ETAP protection results"><figcaption data-fr>Analyse et vérification de la coordination</figcaption><figcaption data-en>Coordination analysis and verification</figcaption></figure>
                </div>
              </div>
              <div class="study-banner"><strong data-fr>Objectif final</strong><strong data-en>Final objective</strong><p data-fr>Construire une protection fiable et sélective du réseau, tout en conservant la continuité de service autant que possible.</p><p data-en>Build a reliable and selective protection scheme while preserving service continuity as much as possible.</p></div>
            </div>
          </section>
          '''
          pattern=r'(<section class="project-head">.*?</section>).*?(<footer)'
          new=r'\1\n'+body+r'\n\2'
          s,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not locate project content before footer')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etap-industrial-network.html
          git diff --cached --quiet || git commit -m 'Split ETAP page into power flow and protection studies'
          git push origin HEAD:main
