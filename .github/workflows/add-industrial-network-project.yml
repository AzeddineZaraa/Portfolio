name: Add Industrial Network Project

on:
  push:
    paths:
      - '.github/workflows/add-industrial-network-project.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add project card to index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = 'id="industrial-network-project"'
          if marker in html:
              print('Industrial project card already present.')
              raise SystemExit(0)

          card = '''\n<article class="project" id="industrial-network-project"><div class="cover"><img src="assets/img1.png" alt="Industrial Electrical Network ETAP"><span class="pnum">05</span></div><div class="pbody"><h3><span data-fr>Réseau Électrique Industriel — Load Flow</span><span data-en>Industrial Electrical Network — Load Flow</span></h3><p data-fr>Modélisation et analyse Load Flow d'un réseau électrique industriel sous ETAP.</p><p data-en>Modelling and load-flow analysis of an industrial electrical network using ETAP.</p><div class="tags"><span class="tag">ETAP</span><span class="tag">Load Flow</span><span class="tag">Industrial Network</span></div><a class="gallery-btn" href="etap-industrial-network.html"><i class="fa-solid fa-arrow-right"></i><span data-fr>Voir le projet</span><span data-en>View project</span></a></div></article>'''

          needle = '''</div></div></section>\n\n<section class="section alt" id="experience">'''
          if needle not in html:
              raise SystemExit('Project section boundary not found; no changes made.')

          html = html.replace(needle, card + needle, 1)
          path.write_text(html, encoding='utf-8')
          print('Industrial project card inserted.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add industrial ETAP project to portfolio"
          git push
